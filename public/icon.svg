<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="filmStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Clapperboard Top Strip (Angled slightly) -->
  <g transform="translate(106, 120)">
    <rect x="0" y="0" width="300" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Clapper Chevrons -->
    <path d="M 20 0 L 45 60 L 75 60 L 50 0 Z" fill="#38bdf8" />
    <path d="M 95 0 L 120 60 L 150 60 L 125 0 Z" fill="#38bdf8" />
    <path d="M 170 0 L 195 60 L 225 60 L 200 0 Z" fill="#38bdf8" />
    <path d="M 245 0 L 270 60 L 300 60 L 275 0 Z" fill="#38bdf8" />
  </g>

  <!-- Invoice Sheet Body -->
  <g transform="translate(116, 185)">
    <!-- Sheet background -->
    <rect x="0" y="0" width="280" height="220" rx="16" fill="#ffffff" filter="url(#glow)" />

    <!-- Invoice Header Bar -->
    <rect x="0" y="0" width="280" height="42" rx="16" fill="url(#filmStrip)" />
    <!-- Film sprocket dots in header -->
    <circle cx="30" cy="21" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="60" cy="21" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="220" cy="21" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="250" cy="21" r="5" fill="#ffffff" opacity="0.9" />

    <!-- Invoice Lines -->
    <rect x="25" y="65" width="130" height="12" rx="6" fill="#0f172a" />
    <rect x="195" y="65" width="60" height="12" rx="6" fill="#6366f1" />

    <rect x="25" y="95" width="160" height="8" rx="4" fill="#94a3b8" />
    <rect x="205" y="95" width="50" height="8" rx="4" fill="#94a3b8" />

    <rect x="25" y="115" width="140" height="8" rx="4" fill="#cbd5e1" />
    <rect x="205" y="115" width="50" height="8" rx="4" fill="#cbd5e1" />

    <rect x="25" y="135" width="110" height="8" rx="4" fill="#cbd5e1" />
    <rect x="205" y="135" width="50" height="8" rx="4" fill="#cbd5e1" />

    <line x1="25" y1="160" x2="255" y2="160" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Total Tag -->
    <rect x="25" y="175" width="80" height="10" rx="5" fill="#64748b" />
    <rect x="155" y="170" width="100" height="20" rx="6" fill="#10b981" />
    <!-- Rupiah symbol / checkmark inside total -->
    <path d="M 185 180 L 195 185 L 210 175" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Video Camera Lens badge in corner -->
  <g transform="translate(340, 340)">
    <circle cx="45" cy="45" r="40" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#glow)" />
    <polygon points="38,30 62,45 38,60" fill="#38bdf8" />
  </g>
</svg>
